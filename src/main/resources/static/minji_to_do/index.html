<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>토이 1호 : 첫 웹페이지</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <section>
    <h1>조이의 첫 웹페이지</h1>
    <p>웹 개발을 시작했습니다!</p>
    <p>오늘은 <b>좋은 날</b>입니다.</p>
    <!-- <b> : 굵은 단어를 만듭니다. -->
  </section>
  <section>
    <h2>오늘 할 일</h2>
    <!--  리스트 만들기  -->
    <!-- <ul> : 리스트 틀 -->
    <ul>
      <li> 독서하기 </li> <!-- <li> : 현재 리스트의 항목 한 개 -->
      <li> 운동하기 </li>
      <li> 산책시키기 </li>
      <li> 복습하기 </li>
    </ul>
    <!-- 입력창 & 버튼 만들기 -->
    <lable for="nickname">별명</lable> 
    <input 
      id ="nickname" 
      type="text"
      placeholder="별명을 입력하세요">
      <!-- input은 안쪽에 글자가 없는 빈요소 이기때문에 닫는 태그가 없음 -->
    <button id="helloButton" type="button">확인</button>
    <br>
  </section>
  
  <!-- <section>대신에 <div> 사용 -->
  
  <div class = "card">
    <h2>🍺 오늘 할 일</h2>
    <p> 오늘도 열심히 공부했어요</p>
    
    <div>
      <input type = "text" id = "taskinput"
      placeholder = "할 일을 입력하세요">
      
      <button id="addButton">추가하기</button> 
    </div>
     
     <!-- 입력상자에서 입력한 값(할 일)을 추가하기 -->
     <ul id=tasklist></ul>
  </div>
   <hr>
   <div id = "result"> 행운을 뽑아봅시다.</div> 
   
   <button onclick = "drawFortune()">행운 뽑기</button>
   <button onclick = "saveFortune()">행운 저장</button>
   <button onclick = "loadFortune()">저장된 행운 불러오기</button>
   <button onclick = "deleteFortune">저장 삭제</button>



 <script src="js/app.js"></script>
</body>
</html>
