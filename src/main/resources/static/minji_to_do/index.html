<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>토이 1호 : 첫 웹페이지</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <section>
    <h1>조이의 첫 웹페이지</h1>
    <p>웹 개발을 시작했습니다!</p>
    <p>오늘은 <b>좋은 날</b>입니다.</p>
    <!-- <b> : 굵은 단어를 만듭니다. -->
  </section>
  <section>
    <h2>오늘 할 일</h2>
    <!--  리스트 만들기  -->
    <!-- <ul> : 리스트 틀 -->
    <ul>
      <li> 독서하기 </li> <!-- <li> : 현재 리스트의 항목 한 개 -->
      <li> 운동하기 </li>
      <li> 산책시키기 </li>
      <li> 복습하기 </li>
    </ul>
    <!-- 입력창 & 버튼 만들기 -->
    <lable for="nickname">별명</lable> 
    <input 
      id ="nickname" 
      type="text"
      placeholder="별명을 입력하세요">
      <!-- input은 안쪽에 글자가 없는 빈요소 이기때문에 닫는 태그가 없음 -->
    <button id="helloButton" type="button">확인</button>
    <br>
  </section>
  
  <!-- <section>대신에 <div> 사용 -->
  
  <div class = "card">
    <h2>오늘 할 일</h2>
    <p>JavaScript 기초 배우기</p>
  </div>
  <!-- 객체와 배열 -->
  <div class = "card">
    <button id=button1>첫 번째 배열 요소값 출력</button>
    <button id=button2>두 번째 배열 요소값 출력</button>
    <button id=button3>세 번째 배열 요소값 출력</button>
    <button id=button4>네 번째 배열 요소값 출력</button>
    <button id=button5>다섯 째 배열 요소값 출력</button>
  </div>

 <!-- 외부파일 js -->
 <script src="js/app.js"></script>
</body>
</html>
