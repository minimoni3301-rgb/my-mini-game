<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>보물찾기 게임</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class = "game-Card">
    <h1>보물찾기 게임</h1>
    <p>숨겨진 보물을 찾아라</p>
  </div>
  <hr>
  
  <div class = "game-Card">
    <h2>클릭 점수 게임</h2>
    <p>현재 점수: <span id="score">0</span></p>
  </div>
  
  <div class = "game-Card">
    <h2>숫자 맞추기</h2>
    <p><span class="highlight">1부터 50까지</span>의 숫자를 맞추세요</p>
  </div>
  
  <div>
    <p class = "game-Card">현재 점수는 
      <span class = "highlight">20점</span>
      입니다.</p>
    
    <h3>분발해주세요</h3>
  </div>
  
  <div>
    <p>
       <strong>주의:</strong>
       게임을 시작하기 전에 이름을 입력하세요 </p>
    <p> 이번 게임은 <em id="emp">시간 안에</em>
    정답을 맞추는 게임입니다.</p>  
  </div>
  
  <button onclick="startgame">시작하기</button>
  <button onclick="resetbutton">다시 시작</button>
  <button onclick="checkscore">점수 확인</button>
</body>
</html>
